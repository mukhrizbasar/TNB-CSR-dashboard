<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TNB CSR Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: summary band (KPIs + status pipeline) above a map | project panel split, state breakdown below. */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef2f0; --line:#d9e0dc; --fg:#15211c; --muted:#5d6b64;
  --accent:#e59a12; --accent-ink:#7a4d00; --land:#e3e9e5; --land-line:#b9c5be; --sea:#dbe7ee;
  --s-visit:#8a948f; --s-proposal:#e0a800; --s-memo:#e07a10; --s-approved:#3d7fd6; --s-ongoing:#2563c9; --s-done:#1f9d5c; --s-vendor:#7b5bd0; --s-rejected:#b94a48;
  --good:#1f9d5c; --bad:#cf3b3b;
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#171f1c; --surface-2:#1e2824; --line:#2c3833; --fg:#e6ece9; --muted:#97a59e;
  --accent:#f2b13a; --accent-ink:#f6c866; --land:#24302b; --land-line:#3d4c45; --sea:#121b1f;
  --s-visit:#8f9a95; --s-proposal:#e8b923; --s-memo:#f08c2e; --s-approved:#5b97e8; --s-ongoing:#4a86e8; --s-done:#35b673; --s-vendor:#a58bf0; --s-rejected:#e57373;
  --good:#35b673; --bad:#e86060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#171f1c; --surface-2:#1e2824; --line:#2c3833; --fg:#e6ece9; --muted:#97a59e;
  --accent:#f2b13a; --accent-ink:#f6c866; --land:#24302b; --land-line:#3d4c45; --sea:#121b1f;
  --s-visit:#8f9a95; --s-proposal:#e8b923; --s-memo:#f08c2e; --s-approved:#5b97e8; --s-ongoing:#4a86e8; --s-done:#35b673; --s-vendor:#a58bf0; --s-rejected:#e57373;
  --good:#35b673; --bad:#e86060; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:8px}
.sun{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.sub{color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1300}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.nav{display:flex;flex-direction:column;gap:8px}
.chips.pillars .chip{padding:8px 14px;font-size:.9rem}
.chips.progs{padding-left:12px;border-left:3px solid var(--accent)}
.chips.progs .chip{font-size:.8rem;padding:5px 11px}
.checks{border:1px solid var(--line);border-radius:7px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 16px;margin:0}
.checks legend{font-size:.78rem;font-weight:600;color:var(--muted);padding:0 4px}
.checks label{flex-direction:row!important;align-items:center;gap:6px!important;color:var(--fg)!important;font-weight:500!important}
.checks input{width:auto!important}
.prog{display:inline-block;width:80px;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;vertical-align:middle}
.prog span{display:block;height:100%;background:var(--s-ongoing)}
.card h2+.bars{margin-top:-4px}
.kpi.click{cursor:pointer;transition:background .15s}
.kpi.click:hover{background:var(--surface-2)}
.kpi.on{background:color-mix(in srgb,var(--accent) 18%,var(--surface));box-shadow:inset 0 -3px 0 var(--accent)}
.kpi.off{opacity:.55}
.kpi-sub{align-self:flex-start;border:0;background:none;padding:0;font-size:.75rem;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.kpi-sub.on{color:var(--fg);font-weight:700}
.bar.click{cursor:pointer;border-radius:6px;padding:3px 6px;margin:-3px -6px}
.bar.click:hover{background:var(--surface-2)}
.bar.on{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.bar.off,.pipe-bar .seg.off,.pipe-legend button.off{opacity:.35}
.pipe-bar .seg{cursor:pointer}
.bar .seg{cursor:pointer}
.bar .seg:hover,.pipe-bar .seg:hover{filter:brightness(1.12)}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-head h2{margin-right:auto}
.card-head select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 8px;font-size:.85rem}
.seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg-toggle button{border:0;background:var(--surface);padding:4px 10px;font-size:.78rem;font-weight:700}
.seg-toggle button+button{border-left:1px solid var(--line)}
.seg-toggle button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line));background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:999px;padding:4px 10px;font-size:.82rem;text-align:left}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#1d1300;font-size:.72rem;font-weight:800;text-align:center}
.slicers{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.slicer-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.slicer-head .btn{margin-left:auto}
.slicer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.slicer{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.slicer-t{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--s-ongoing);font-weight:600;font-size:.78rem;text-transform:none;letter-spacing:0}
.slicer-q{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;font-size:.85rem;min-width:0}
.slicer-list{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.slicer-list label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.85rem;padding:2px 2px;cursor:pointer}
.slicer-list label span:nth-child(2){overflow-wrap:anywhere}
.slicer-list label.zero{opacity:.45}
.slicer-list .num{font-size:.78rem;color:var(--muted)}
.side-tools{display:flex;align-items:center;gap:8px}
#fSort{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 6px;font-size:.8rem;max-width:150px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{font-family:var(--f-mono);font-size:.78rem;opacity:.7}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.filters input{flex:1 1 200px;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:.75rem;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.kpi .h{font-size:.75rem;color:var(--muted)}
.kpis-solar{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:-6px}
.kpis-solar .l::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s-done);margin-right:6px;vertical-align:1px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis-solar{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pipe-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.pipe-bar span{display:block;height:100%}
.pipe-legend{display:flex;flex-wrap:wrap;gap:6px 16px}
.pipe-legend button{border:0;background:none;padding:2px 0;display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--fg)}
.pipe-legend button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.actions{align-items:center}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:560px}
@media (max-width:960px){.mapbox{height:420px}}
#map{position:absolute;inset:0;background:var(--sea)}
.map-tools{position:absolute;top:10px;right:10px;z-index:1000;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.map-legend{position:absolute;left:10px;bottom:10px;z-index:1000;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.75rem;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 20px)}
.map-legend .row{display:flex;align-items:center;gap:6px}
.pick-banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:1000;background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:999px;font-weight:600;font-size:.85rem;white-space:nowrap}

/* Leaflet core (inlined) */
.leaflet-pane,.leaflet-marker-icon,.leaflet-zoom-box,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-pane>svg{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--f-body)}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-marker-icon{display:block}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-container.picking,.leaflet-container.picking .leaflet-grab{cursor:crosshair}
.leaflet-marker-icon,.leaflet-pane>svg path{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:visiblePainted;pointer-events:auto}
.leaflet-interactive{cursor:pointer}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-control-zoom{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.leaflet-control-zoom a{display:block;width:32px;height:32px;line-height:30px;text-align:center;text-decoration:none;color:var(--fg);font-size:18px;font-weight:600}
.leaflet-control-zoom a+a{border-top:1px solid var(--line)}
.leaflet-control-zoom a.leaflet-disabled{opacity:.4;cursor:default}
.leaflet-tooltip{position:absolute;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.8rem;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:320px;overflow:hidden;text-overflow:ellipsis}
.leaflet-control-layers{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.state-label{background:none;border:0;box-shadow:none;color:var(--muted);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0}

.pin-svg{display:block;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.map-legend .pin-svg{filter:none;flex:none}

.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;height:560px}
@media (max-width:960px){.side{height:auto;max-height:none}}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.list{overflow:auto;flex:1;min-height:0}
@media (max-width:960px){.list{max-height:520px}}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.item:hover{background:var(--surface-2)}
.item.sel{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.item .nm{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .meta{grid-column:2/4;font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.item .val{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap}
.item .no{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding-top:2px;min-width:22px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--fg);white-space:nowrap}
.pill .dot{background:var(--pc);width:7px;height:7px}
.flag{font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.flag.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.flag.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.empty{padding:28px 18px;color:var(--muted);text-align:center}

.detail{overflow:auto;flex:1;min-height:0;padding:14px;display:flex;flex-direction:column;gap:14px}
.detail h3{font-size:1.1rem;line-height:1.3;overflow-wrap:anywhere}
.dl{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:6px 14px;margin:0}
.dl dt{color:var(--muted);font-size:.82rem}
.dl dd{margin:0;overflow-wrap:anywhere}
.loc{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.loc a{color:var(--s-ongoing);font-weight:600}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}

form.edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}
form.edit .full{grid-column:1/-1}
form.edit label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
form.edit input,form.edit select,form.edit textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;font-size:.9rem;color:var(--fg);font-weight:500;min-width:0;width:100%}
form.edit textarea{min-height:64px;resize:vertical}
.hint{font-size:.75rem;color:var(--muted);font-weight:500}
.confirm{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.lower{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:baseline;font-size:.85rem}
.bar .track{grid-column:1/-1;height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden;display:flex}
.bar .track span{display:block;height:100%}
.bar .n{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .lab{overflow-wrap:anywhere;grid-row:1;grid-column:1}
.bar .n{grid-row:1;grid-column:2}
.bar .track{grid-row:2}
.bar .track:empty{display:none}
.note{font-size:.78rem;color:var(--muted)}
.toast{max-width:calc(100vw - 32px);text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:2000;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.status-line{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.photos-box{display:flex;flex-direction:column;gap:8px}
.photos-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.ph-tile{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.ph-tile img{width:100%;height:100%;object-fit:cover;display:block}
.ph-busy{display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);cursor:default;text-align:center;padding:4px}
.lightbox{position:fixed;inset:0;z-index:3000;background:rgba(8,12,10,.86);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lb-inner{background:var(--surface);border-radius:12px;max-width:min(1100px,100%);max-height:100%;width:100%;display:flex;flex-direction:column;gap:10px;padding:12px;overflow:auto}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lb-img{position:relative;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:8px;min-height:200px}
.lb-img img{max-width:100%;max-height:70vh;object-fit:contain;display:block}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;border:0;border-radius:8px;background:rgba(0,0,0,.45);color:#fff;font-size:28px;line-height:1}
.lb-nav:disabled{opacity:.2;cursor:default}
#lbPrev{left:8px} #lbNext{right:8px}
.lb-edit{display:flex;gap:8px;flex-wrap:wrap}
.lb-edit input{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:7px 9px}
.lb-cap{font-weight:600}
</style>
<style>body{margin:0} [hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow"><span class="sun"></span><span id="eyebrow">TNB CSR</span></div>
      <h1 id="appTitle">TNB CSR Dashboard</h1>
      <div class="sub"><span id="appSub"></span> <span id="syncNote" class="status-line">Connecting…</span></div>
    </div>
    <div class="actions">
      <span class="status-line" id="who"></span>
      <button class="btn" id="signInBtn" type="button"><svg width="14" height="14" viewBox="0 0 48 48" aria-hidden="true" style="vertical-align:-2px;margin-right:6px"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</button>
      <button class="btn" id="signOutBtn" type="button" hidden>Sign out</button>
      <button class="btn" id="importBtn" type="button" hidden>Import list</button>
      <input type="file" id="importAny" accept=".xlsx,.xls,.json" hidden>
      <button class="btn" id="exportBtn" type="button">Export to Excel</button>
      <button class="btn primary" id="addBtn" type="button" hidden>+ Add project</button>
    </div>
  </header>

  <nav class="nav" aria-label="Pillars and programmes">
    <div class="chips pillars" id="pillarChips" role="group" aria-label="Pillar"></div>
    <div class="chips progs" id="progChips" role="group" aria-label="Programme" hidden></div>
  </nav>

  <div class="filters">
    <div class="chips" id="typeChips" role="group" aria-label="Solar type" hidden></div>
    <select id="fYear" aria-label="Year"></select>
    <button class="btn" id="slicerBtn" type="button" aria-expanded="false" aria-controls="slicerPanel">Filters</button>
    <input id="fSearch" type="search" placeholder="Search name, district, agency, vendor, school…" aria-label="Search">
  </div>

  <section class="slicers" id="slicerPanel" hidden aria-label="Filters"></section>
  <div class="active-filters" id="activeFilters" hidden></div>

  <section class="kpis" id="kpis" aria-label="Summary"></section>
  <section class="kpis kpis-solar" id="solarKpis" aria-label="Solar totals" hidden></section>

  <section class="pipe" aria-label="Project status">
    <h2 id="pipeTitle">Status pipeline</h2>
    <div class="pipe-bar" id="pipeBar"></div>
    <div class="pipe-legend" id="pipeLegend"></div>
  </section>

  <section class="main">
    <div class="mapbox">
      <div id="map" aria-label="Map of project locations"></div>
      <div class="map-tools" style="top:auto;bottom:24px;right:60px">
        <button class="btn small" type="button" id="viewPen">Peninsular</button>
        <button class="btn small" type="button" id="viewAll">All Malaysia</button>
      </div>
      <div class="pick-banner" id="pickBanner" hidden>Click the map to set the location</div>
      <div class="map-legend" id="mapLegend"></div>
    </div>

    <aside class="side" id="side">
      <div class="side-head"><h2 id="sideTitle">Projects</h2><span class="side-tools"><select id="fSort" aria-label="Sort list"><option value="default">Sort: default</option><option value="value">Value, high to low</option><option value="name">Name A–Z</option><option value="status">Status</option><option value="state">State / district</option><option value="progress">Build progress</option><option value="updated">Recently updated</option></select><span class="status-line" id="listCount"></span></span></div>
      <div class="list" id="list"><div class="empty">Loading projects…</div></div>
      <div class="detail" id="detail" hidden></div>
    </aside>
  </section>

  <section class="lower">
    <div class="card">
      <div class="card-head" id="stateHead"></div>
      <div class="bars" id="stateBars"></div>
      <div class="note" id="stateNote"></div>
    </div>
    <div class="card" id="brkCard">
      <div class="card-head" id="brkHead"></div>
      <div class="bars" id="brkBars"></div>
    </div>
    <div class="card" id="card2"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lightbox" hidden></div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
